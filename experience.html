<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>C Design — Experiență 3D | Web Design 2025</title>
<link rel="icon" type="image/png" href="/logo-c-design.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00a8a8; --teal-glow:#19e3c8; --gold:#c9a96e; --gold-dk:#a8843d;
    --sage-1:#dff0e6; --sage-2:#bfe0d8; --sage-3:#8fc7bd; --deep:#0f2723;
    --ink:#0e1f1c; --soft:#33514c; --muted:#5e7a74;
    --glass:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.65);
    --rx:0deg; --ry:0deg;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink); overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 18%, #f3faf5 0%, var(--sage-1) 32%, var(--sage-2) 64%, var(--sage-3) 100%);
    background-attachment:fixed;
  }
  h1,h2,h3,.dh{font-family:'Space Grotesk',sans-serif}

  /* ---- Top bar ---- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;pointer-events:none}
  .topbar a,.topbar .brand{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:1.05rem;color:var(--deep);letter-spacing:.5px}
  .brand img{height:30px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
  .topbar .links{display:flex;gap:10px;align-items:center}
  .pill{font-size:.82rem;font-weight:600;text-decoration:none;padding:9px 16px;border-radius:40px;transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pill.ghost{color:var(--deep);background:rgba(255,255,255,.45);border:1px solid var(--glass-brd)}
  .pill.ghost:hover{background:rgba(255,255,255,.75)}
  .pill.cta{color:#10201d;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dk) 100%);border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 20px rgba(168,132,61,.35)}
  .pill.cta:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(168,132,61,.45)}

  /* ---- 3D Stage ---- */
  .stage{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 42%;z-index:10}
  .scene{position:absolute;inset:0;transform-style:preserve-3d;
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .25s cubic-bezier(.22,.61,.36,1)}

  /* Platform base (isometric tray) */
  .platform{position:absolute;left:50%;top:54%;width:min(760px,82vw);height:min(420px,46vh);
    transform:translate(-50%,-50%) translateZ(-20px) rotateX(52deg) rotateZ(-38deg);
    transform-style:preserve-3d;
  }
  .platform-face{position:absolute;width:100%;height:100%;transform-style:preserve-3d;
    background:linear-gradient(145deg, #2a3f3a 0%, #1f302b 100%);
    border-radius:20px;box-shadow:0 60px 80px rgba(15,39,35,.35), inset 0 1px 0 rgba(255,255,255,.08)}
  .platform-top{width:100%;height:100%;background:linear-gradient(135deg, #1a2723 0%, #0f1f1a 100%);
    border-radius:20px;position:relative;overflow:hidden}
  .platform-top::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 32% 40%, rgba(25,227,200,.05) 0%, transparent 50%);
    pointer-events:none}

  /* terrain canvas (on platform) */
  #terrain{position:absolute;left:50%;top:50%;width:100%;height:100%;
    transform:translate(-50%,-50%) translateZ(1px);
    opacity:.95;filter:drop-shadow(0 15px 30px rgba(0,0,0,.25))}

  /* Back panels (glassmorphism UI mockups) */
  .panel-bg{position:absolute;transform-style:preserve-3d;
    background:linear-gradient(155deg, rgba(42,63,58,.45) 0%, rgba(30,48,43,.35) 100%);
    border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-radius:18px;padding:28px 22px;box-shadow:0 25px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
    cursor:pointer;transition:all .3s ease;font-size:.75rem;color:#ddd;line-height:1.6}
  .panel-bg:hover{background:linear-gradient(155deg, rgba(42,63,58,.55) 0%, rgba(30,48,43,.45) 100%);
    border-color:rgba(25,227,200,.4);box-shadow:0 30px 60px rgba(0,168,168,.2), inset 0 1px 0 rgba(255,255,255,.2);
    transform:translateZ(40px)}
  .panel-bg .title{font-family:'Space Grotesk';font-weight:700;font-size:1.1rem;color:var(--teal-glow);margin-bottom:12px;letter-spacing:.5px}
  .panel-bg .icon{font-size:2rem;margin-bottom:14px;display:block}
  .panel-bg .desc{font-size:.72rem;margin-bottom:10px;opacity:.8}
  .panel-bg .bar{width:100%;height:8px;background:rgba(255,255,255,.12);border-radius:2px;margin:8px 0}
  .panel-bg .btn-sm{display:inline-flex;gap:5px;align-items:center;padding:6px 10px;background:rgba(0,168,168,.25);border:1px solid rgba(0,168,168,.4);border-radius:6px;font-size:.65rem;color:var(--teal-glow);margin-top:8px;transition:.2s}
  .panel-bg .btn-sm:hover{background:rgba(0,168,168,.35);border-color:rgba(25,227,200,.6)}

  /* Panel positions */
  .panel-1{left:8%;top:18%;width:min(200px,22vw);height:auto;transform:translate(0,0) translateZ(80px) rotateY(22deg) rotateX(8deg)}
  .panel-2{left:50%;top:8%;width:min(240px,26vw);height:auto;transform:translate(-50%,0) translateZ(60px) rotateX(6deg)}
  .panel-3{left:82%;top:20%;width:min(200px,22vw);height:auto;transform:translate(-100%,0) translateZ(75px) rotateY(-24deg) rotateX(8deg)}

  /* Plante (decorative) */
  .plant{position:absolute;transform-style:preserve-3d;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2))}
  .plant-pot{width:48px;height:54px;border-radius:8px 8px 12px 12px;
    background:linear-gradient(135deg, #3a5a52 0%, #2a4a42 100%);
    border:2px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
  .plant-pot::before{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.1) 50%, transparent 100%)}
  .plant-leaves{position:absolute;width:100%;height:100%;top:-8px;left:0}
  .leaf{position:absolute;width:12px;height:40px;background:linear-gradient(135deg, #2d8070 0%, #1a5a50 100%);
    border-radius:50% 50% 30% 30%;box-shadow:inset 0 1px 2px rgba(255,255,255,.15)}
  .leaf:nth-child(1){left:8px;top:6px;transform:rotate(-28deg)}
  .leaf:nth-child(2){left:18px;top:2px;transform:rotate(15deg)}
  .leaf:nth-child(3){right:10px;top:10px;transform:rotate(35deg)}

  .plant-1{left:12%;top:66%;transform:translate(-50%,-50%) translateZ(110px)}
  .plant-2{right:10%;top:62%;transform:translate(50%,-50%) translateZ(95px) scaleX(-1)}
  .plant-grass{left:28%;top:72%;width:80px;height:45px;transform:translate(-50%,-50%) translateZ(100px)}
  .plant-tree{left:74%;top:68%;width:60px;height:80px;transform:translate(-50%,-50%) translateZ(105px)}

  /* Grass patch (simple SVG inline) */
  svg.grass{width:100%;height:100%}

  /* Ambient orbs (glossy spheres) */
  .orb{position:absolute;border-radius:50%;transform-style:preserve-3d;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(143,199,189,.5) 50%, rgba(0,168,168,.3));
    box-shadow:0 20px 45px rgba(15,39,35,.28), inset 0 -10px 20px rgba(15,39,35,.2), inset 6px 6px 12px rgba(255,255,255,.35);
    animation:bob 7s ease-in-out infinite alternate}
  .orb.glass{background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.9), rgba(143,199,189,.4) 60%, rgba(0,168,168,.25));}

  /* Smartphone (on left-front) */
  .phone{position:absolute;left:18%;top:82%;width:min(120px,13vw);height:min(200px,22vh);
    transform:translate(-50%,-50%) translateZ(140px) rotateZ(-12deg) rotateX(15deg);
    background:#0a1310;border:3px solid #1a2f28;border-radius:14px;overflow:hidden;
    box-shadow:0 30px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .phone::before{content:'';position:absolute;inset:3px;background:linear-gradient(135deg, #1a3a35 0%, #0f2723 100%);
    border-radius:10px;display:grid;place-items:center;font-size:0.6rem;color:#666}

  /* Pills/buttons on platform edge (front) */
  .pills{position:absolute;left:50%;bottom:-8%;width:100%;transform:translate(-50%,0) translateZ(15px);
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 20px}
  .pill-btn{padding:8px 14px;border-radius:50px;background:rgba(255,255,255,.25);
    border:1px solid rgba(255,255,255,.4);font-size:.65rem;color:#fff;cursor:pointer;
    transition:all .2s;backdrop-filter:blur(8px);font-weight:600;
  }
  .pill-btn:hover{background:rgba(255,255,255,.4);border-color:rgba(25,227,200,.6);box-shadow:0 8px 18px rgba(0,168,168,.2)}

  /* Color swatches (palette samples) */
  .swatches{position:absolute;right:16%;bottom:20%;transform:translateZ(110px);
    display:flex;gap:8px;flex-direction:column}
  .swatch{width:32px;height:40px;border-radius:6px;border:1px solid rgba(255,255,255,.4);
    box-shadow:0 10px 20px rgba(0,0,0,.2);transition:.2s;cursor:pointer}
  .swatch:hover{transform:scale(1.08)}

  /* terrain canvas */
  @media(min-width:821px){
    /* hide old nodes, use new 3D scene */
    .node{display:none}
  }

  /* ambient orbs */
  .orb{animation:bob 7s ease-in-out infinite alternate}
  .orb-1{width:48px;height:48px;left:10%;top:28%;transform:translateZ(130px);animation-delay:-1s}
  .orb-2{width:70px;height:70px;left:84%;top:32%;transform:translateZ(50px);animation-delay:-3s;opacity:.85}
  .orb-3{width:32px;height:32px;left:22%;top:78%;transform:translateZ(160px);animation-delay:-2s}
  .orb-4{width:44px;height:44px;left:76%;top:82%;transform:translateZ(100px);animation-delay:-4s;opacity:.9}

  /* ---- Hero text (on top) ---- */
  .hero3d{position:absolute;left:50%;top:12%;transform:translate(-50%,-50%) translateZ(200px);text-align:center;width:min(580px,84vw)}
  .hero3d .eyebrow{font-family:'Space Grotesk';font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:.68rem;color:var(--teal);margin-bottom:8px}
  .hero3d h1{font-size:clamp(2.2rem,5.2vw,3.8rem);font-weight:700;line-height:1.05;color:var(--deep);
    text-shadow:0 6px 20px rgba(15,39,35,.15)}
  .hero3d h1 .yr{display:block;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-glow) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero3d p{margin-top:10px;color:var(--soft);font-size:clamp(.88rem,1.5vw,1rem);max-width:420px;margin-left:auto;margin-right:auto}
  .hint{margin-top:14px;font-size:.74rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
  .hint .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(0,168,168,.5);animation:pulse 2s infinite}

  /* ---- Overlay panel (block content) ---- */
  .overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.on{display:flex}
  .overlay .scrim{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 30%, rgba(15,39,35,.35), rgba(15,39,35,.62));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
  .overlay.on .scrim{opacity:1}
  .panel{position:relative;width:min(640px,94vw);max-height:86vh;overflow:auto;border-radius:26px;padding:34px 32px;
    background:linear-gradient(155deg, rgba(255,255,255,.94) 0%, rgba(230,244,237,.92) 100%);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 40px 90px rgba(15,39,35,.4), inset 0 1px 0 rgba(255,255,255,.9);
    transform:translateY(30px) scale(.94);opacity:0;transition:transform .4s cubic-bezier(.18,.78,.3,1), opacity .35s}
  .overlay.on .panel{transform:none;opacity:1}
  .panel .x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-brd);
    background:rgba(255,255,255,.7);cursor:pointer;font-size:1.2rem;color:var(--soft);display:grid;place-items:center;transition:.2s}
  .panel .x:hover{background:#fff;color:var(--deep);transform:rotate(90deg)}
  .panel .p-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;margin-bottom:14px;
    background:linear-gradient(135deg, rgba(0,168,168,.18), rgba(201,169,110,.2));border:1px solid rgba(255,255,255,.7)}
  .panel h2{font-size:clamp(1.5rem,3.4vw,2.1rem);color:var(--deep);line-height:1.1;margin-bottom:6px}
  .panel .lead{color:var(--soft);font-size:1rem;margin-bottom:18px}
  .panel ul{list-style:none;display:grid;gap:10px;margin:0 0 22px}
  .panel ul li{display:flex;gap:11px;align-items:flex-start;font-size:.95rem;color:var(--ink);
    background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:12px 14px}
  .panel ul li b{color:var(--deep)}
  .panel ul li .ck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#fff;
    background:linear-gradient(135deg,var(--teal),#0c8a8a);margin-top:1px}
  .panel .actions{display:flex;flex-wrap:wrap;gap:12px}
  .panel .btn{flex:1 1 auto;text-align:center;text-decoration:none;font-family:'Space Grotesk';font-weight:600;font-size:.92rem;
    padding:14px 22px;border-radius:14px;transition:.2s}
  .panel .btn.primary{color:#10201d;background:linear-gradient(135deg,var(--gold),var(--gold-dk));box-shadow:0 10px 26px rgba(168,132,61,.35)}
  .panel .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(168,132,61,.45)}
  .panel .btn.line{color:var(--deep);background:rgba(0,168,168,.1);border:1px solid var(--teal)}
  .panel .btn.line:hover{background:rgba(0,168,168,.2)}

  /* ---- animations ---- */
  @keyframes floaty{from{transform:translateY(-7px)}to{transform:translateY(9px)}}
  @keyframes bob{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,168,168,.5)}70%{box-shadow:0 0 0 10px rgba(0,168,168,0)}100%{box-shadow:0 0 0 0 rgba(0,168,168,0)}}
  @keyframes spinrise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .loaded .hero3d{animation:spinrise .8s both}
  .loaded .panel-bg{animation:spinrise .9s both}
  .loaded .orb{animation:bob 7s ease-in-out infinite alternate}

  /* ---- Mobile: flatten the 3D into a clean scroll ---- */
  @media(max-width:820px){
    body{overflow:auto}
    .stage{position:relative;height:auto;min-height:100vh;perspective:none;padding:96px 18px 60px}
    .scene{position:static;transform:none!important}
    .platform,.panel-bg,.plant,.plant-grass,.plant-tree,.phone,.pills,.swatches,.orb{display:none}
    #terrain{display:none}
    .hero3d{position:static;transform:none;width:100%;margin-bottom:28px}
    /* restore nodes as cards */
    .node{display:block;position:static!important;transform:none!important;margin:0 auto 16px;max-width:340px}
    .node .card{width:100%;animation:none;transform:none}
    .node:hover .card{transform:scale(1.02)}
    .topbar{position:fixed;background:rgba(243,250,245,.8);backdrop-filter:blur(10px)}
    .topbar .links .pill.ghost{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    .panel-bg,.orb,.hint .dot,.panel-bg{animation:none!important}
    .scene{transition:none}
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/" aria-label="C Design — acasă">
      <img src="/logo-c-design.png" alt="C Design"><span>C&nbsp;Design</span>
    </a>
    <nav class="links">
      <a class="pill ghost" href="/">Site clasic</a>
      <a class="pill cta" href="/programare">Programează acum</a>
    </nav>
  </header>

  <div class="stage" id="stage">
    <div class="scene" id="scene">

      <!-- HERO TEXT (top) -->
      <div class="hero3d">
        <div class="eyebrow">Web Design · 2025</div>
        <h1>Site-ul tău, <span class="yr">în spațiu 3D</span></h1>
        <p>Explorează tot ce facem. Atinge orice element din spațiu ca să-l deschizi.</p>
        <span class="hint"><span class="dot"></span> Mișcă mouse-ul · apasă pe un element</span>
      </div>

      <!-- BACK PANELS (glassmorphism mockups) -->
      <div class="panel-bg panel-1" data-key="servicii" role="button" tabindex="0" aria-label="Servicii">
        <div class="icon">🧩</div>
        <div class="title">Servicii</div>
        <div class="desc">Tot ce-ți trebuie online</div>
        <div class="bar"></div>
        <div class="bar"></div>
        <button class="btn-sm" onclick="event.stopPropagation()">DESCHIDE</button>
      </div>

      <div class="panel-bg panel-2" data-key="portofoliu" role="button" tabindex="0" aria-label="Portofoliu">
        <div class="icon">🖼️</div>
        <div class="title">Portofoliu</div>
        <div class="desc">Rezultate reale</div>
        <div class="bar"></div>
        <div class="bar"></div>
        <button class="btn-sm" onclick="event.stopPropagation()">DESCHIDE</button>
      </div>

      <div class="panel-bg panel-3" data-key="pachete" role="button" tabindex="0" aria-label="Pachete">
        <div class="icon">🚀</div>
        <div class="title">Pachete</div>
        <div class="desc">De la 300€</div>
        <div class="bar"></div>
        <div class="bar"></div>
        <button class="btn-sm" onclick="event.stopPropagation()">DESCHIDE</button>
      </div>

      <!-- ISOMETRIC PLATFORM -->
      <div class="platform">
        <div class="platform-top">
          <canvas id="terrain" width="760" height="420"></canvas>
        </div>
      </div>

      <!-- PLANTE -->
      <div class="plant plant-1">
        <div class="plant-pot">
          <div class="plant-leaves">
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
          </div>
        </div>
      </div>

      <div class="plant plant-2">
        <div class="plant-pot">
          <div class="plant-leaves">
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
          </div>
        </div>
      </div>

      <div class="plant-grass">
        <svg viewBox="0 0 80 45" class="grass">
          <g fill="none" stroke="#2a5a50" stroke-width="1" opacity="0.6">
            <path d="M 10 40 Q 12 25 15 15"/>
            <path d="M 20 40 Q 22 24 25 10"/>
            <path d="M 30 40 Q 32 26 35 14"/>
            <path d="M 40 40 Q 42 24 45 12"/>
            <path d="M 50 40 Q 52 26 55 16"/>
            <path d="M 60 40 Q 62 25 65 13"/>
            <path d="M 70 40 Q 72 27 75 18"/>
          </g>
        </svg>
      </div>

      <div class="plant-tree">
        <svg viewBox="0 0 60 80" class="grass">
          <circle cx="30" cy="20" r="18" fill="#2a6a60" opacity="0.7"/>
          <circle cx="18" cy="28" r="14" fill="#2d7068" opacity="0.65"/>
          <circle cx="42" cy="30" r="14" fill="#2d7068" opacity="0.65"/>
          <rect x="26" y="35" width="8" height="18" fill="#3a4a42"/>
          <ellipse cx="30" cy="55" rx="12" ry="8" fill="#2a5a50" opacity="0.6"/>
        </svg>
      </div>

      <!-- SMARTPHONE (left-front) -->
      <div class="phone"></div>

      <!-- PILLS/BUTTONS (on platform edge) -->
      <div class="pills">
        <button class="pill-btn" data-key="despre" role="button" aria-label="Despre noi">DESPRE</button>
        <button class="pill-btn" data-key="blog" role="button" aria-label="Blog">BLOG</button>
        <button class="pill-btn" data-key="testimoniale" role="button" aria-label="Testimoniale">TESTIMONIALE</button>
        <button class="pill-btn" data-key="contact" role="button" aria-label="Programare">PROGRAMARE</button>
      </div>

      <!-- AMBIENT ORBS (glossy spheres) -->
      <div class="orb orb-1"></div>
      <div class="orb orb-2 glass"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4 glass"></div>

      <!-- COLOR SWATCHES (palette) -->
      <div class="swatches">
        <div class="swatch" style="background:#dff0e6"></div>
        <div class="swatch" style="background:#8fc7bd"></div>
        <div class="swatch" style="background:#00a8a8"></div>
        <div class="swatch" style="background:#c9a96e"></div>
        <div class="swatch" style="background:#0f2723"></div>
      </div>

      <!-- NODES (injected for mobile) -->
      <div id="nodes"></div>

    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" aria-modal="true" role="dialog">
    <div class="scrim" id="scrim"></div>
    <div class="panel" id="panel"></div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- Content blocks ---------- */
  var BLOCKS = {
    servicii:{
      icon:"🧩", title:"Servicii", tagline:"Tot ce-ți trebuie online",
      pos:{x:14,y:30,z:60},
      lead:"De la idee la site live — construim prezența ta digitală cap-coadă.",

      ],

      ],
      cta:{label:"Vezi portofoliul",href:"/#portofoliu"}, alt:null
    },
    pachete:{

      pos:{x:20,y:62,z:100},
      lead:"Pachet complet pentru un start rapid și solid online.",

        ["Logo profesional","identitate vizuală de la zero"],

      ],
      cta:{label:"Vezi pachetul",href:"/pachet-startup"}, alt:{label:"Abonament lunar",href:"/abonament-lunar"}
    },
    despre:{

      pos:{x:82,y:64,z:80},
      lead:"Facem site-uri care aduc clienți, nu premii.",
      items:[
        ["Din 2017","experiență cu zeci de afaceri mici"],
        ["Preț fix","ofertă clară, fără costuri ascunse"],

      ],
      cta:{label:"Despre noi",href:"/despre-noi"}, alt:null
    },
    blog:{
      icon:"📰", title:"Blog", tagline:"Idei & ghiduri",
      pos:{x:6,y:48,z:-40},
      lead:"Sfaturi practice de web design, SEO și prezență online.",
      items:[
        ["Ghiduri","cum să-ți crești afacerea online"],
        ["Tendințe 2025","ce funcționează acum în web design"]
      ],
      cta:{label:"Citește blogul",href:"/blog"}, alt:null
    },
    testimoniale:{
      icon:"⭐", title:"Testimoniale", tagline:"Ce spun clienții",
      pos:{x:92,y:48,z:-30},
      lead:"Ei ne-au ales — și nu au regretat.",
      items:[
        ["Comunicare","ne-au apreciat pentru rapiditate și claritate"],
        ["Rezultate","site-uri care chiar generează cereri"]
      ],
      cta:{label:"Vezi testimonialele",href:"/#testimoniale"}, alt:null
    },
    contact:{
      icon:"📅", title:"Programare", tagline:"Consultanță gratuită",
      pos:{x:50,y:84,z:120},
      lead:"Pregătit să discutăm despre site-ul tău? Te contactăm în maxim 2 ore.",
      items:[
        ["Consultanță gratuită","alegi data și ora preferată"],
        ["Telefon","0753 116 155 — luni–vineri 09:00–18:00"],
        ["Email","office@c-design.ro"]
      ],
      cta:{label:"Programează acum",href:"/programare"}, alt:{label:"Sună 0753 116 155",href:"tel:+40753116155"}
    }
  };

  /* ---------- Build floating nodes (mobile) ---------- */
  var nodesWrap = document.getElementById('nodes');
  var order = ["servicii","portofoliu","pachete","despre","blog","testimoniale","contact"];
  order.forEach(function(key,i){
    var b = BLOCKS[key];
    var node = document.createElement('div');
    node.className = 'node';
    node.style.left = b.pos.x + '%';
    node.style.top = b.pos.y + '%';
    node.style.transform = 'translate(-50%,-50%) translateZ(' + b.pos.z + 'px)';
    node.style.animationDelay = (i*0.08) + 's';
    node.setAttribute('data-key', key);
    node.setAttribute('role','button');
    node.setAttribute('tabindex','0');
    node.setAttribute('aria-label', b.title + ' — ' + b.tagline);
    node.innerHTML =
      '<div class="card" style="animation-delay:' + (-i*0.7) + 's">' +
        '<div class="ic">' + b.icon + '</div>' +
        '<h3>' + b.title + '</h3>' +
        '<div class="tg">' + b.tagline + '</div>' +
        '<span class="open">Deschide <span class="ar">→</span></span>' +
      '</div>';
    nodesWrap.appendChild(node);
  });

  /* ---------- Overlay open/close ---------- */
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');
  var lastFocus = null;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function openBlock(key){
    var b = BLOCKS[key]; if(!b) return;
    lastFocus = document.activeElement;
    var li = b.items.map(function(it){
      return '<li><span class="ck">✓</span><span><b>' + esc(it[0]) + '</b> — ' + esc(it[1]) + '</span></li>';
    }).join('');
    var actions = '<a class="btn primary" href="' + b.cta.href + '">' + esc(b.cta.label) + '</a>';
    if(b.alt) actions += '<a class="btn line" href="' + b.alt.href + '">' + esc(b.alt.label) + '</a>';
    panel.innerHTML =
      '<button class="x" id="closeX" aria-label="Închide">✕</button>' +
      '<div class="p-ic">' + b.icon + '</div>' +
      '<h2>' + esc(b.title) + '</h2>' +
      '<p class="lead">' + esc(b.lead) + '</p>' +
      '<ul>' + li + '</ul>' +
      '<div class="actions">' + actions + '</div>';
    overlay.classList.add('on');
    document.getElementById('closeX').addEventListener('click', closeBlock);
    var fb = panel.querySelector('.btn'); if(fb) fb.focus();
  }
  function closeBlock(){
    overlay.classList.remove('on');
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* Click handlers for desktop 3D elements */
  var panelBgs = document.querySelectorAll('.panel-bg');
  panelBgs.forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      openBlock(el.getAttribute('data-key'));
    });
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openBlock(el.getAttribute('data-key')); }
    });
  });

  var pillBtns = document.querySelectorAll('.pill-btn');
  pillBtns.forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      openBlock(el.getAttribute('data-key'));
    });
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openBlock(el.getAttribute('data-key')); }
    });
  });

  /* Mobile click handlers (nodes) */
  nodesWrap.addEventListener('click', function(e){
    var n = e.target.closest('.node'); if(n) openBlock(n.getAttribute('data-key'));
  });
  nodesWrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'||e.key===' '){ var n=e.target.closest('.node'); if(n){ e.preventDefault(); openBlock(n.getAttribute('data-key')); } }
  });
  document.getElementById('scrim').addEventListener('click', closeBlock);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && overlay.classList.contains('on')) closeBlock(); });

  /* ---------- Parallax (desktop) ---------- */
  var scene = document.getElementById('scene');
  var isTouch = window.matchMedia('(max-width:820px)').matches;
  if(!isTouch){
    var tx=0, ty=0, cx=0, cy=0, raf;
    window.addEventListener('mousemove', function(e){
      var nx = (e.clientX/window.innerWidth - .5);
      var ny = (e.clientY/window.innerHeight - .5);
      tx = nx * 12; ty = -ny * 9;
      if(!raf) raf = requestAnimationFrame(loop);
    });
    function loop(){
      cx += (tx-cx)*0.08; cy += (ty-cy)*0.08;
      document.documentElement.style.setProperty('--ry', cx.toFixed(2)+'deg');
      document.documentElement.style.setProperty('--rx', cy.toFixed(2)+'deg');
      if(Math.abs(tx-cx)>0.01 || Math.abs(ty-cy)>0.01){ raf=requestAnimationFrame(loop); } else { raf=null; }
    }
  }

  /* ---------- Wireframe terrain (canvas) ---------- */
  var cv = document.getElementById('terrain');
  if(cv && cv.getContext){
    var ctx = cv.getContext('2d');
    var W=cv.width, H=cv.height, cols=22, rows=14, t=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.lineWidth=1;
      for(var r=0;r<rows;r++){
        ctx.beginPath();
        for(var c=0;c<=cols;c++){
          var x=(c/cols)*W;
          var base=(r/rows)*H;
          var wave=Math.sin((c*0.5)+(r*0.4)+t)*10 + Math.cos((c*0.3)-(r*0.2)+t*0.7)*8;
          var y=base+wave;
          if(c===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        var a=0.16 + (r/rows)*0.32;
        ctx.strokeStyle='rgba(0,168,168,'+a.toFixed(2)+')';
        ctx.stroke();
      }
      for(var c2=0;c2<=cols;c2++){
        ctx.beginPath();
        for(var r2=0;r2<rows;r2++){
          var x2=(c2/cols)*W;
          var base2=(r2/rows)*H;
          var wave2=Math.sin((c2*0.5)+(r2*0.4)+t)*10 + Math.cos((c2*0.3)-(r2*0.2)+t*0.7)*8;
          var y2=base2+wave2;
          if(r2===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
        }
        ctx.strokeStyle='rgba(25,227,200,0.12)';
        ctx.stroke();
      }
      t+=0.03;
      requestAnimationFrame(draw);
    }
    var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce){ draw = function(){}; }
    requestAnimationFrame(draw);
  }

  /* reveal */
  requestAnimationFrame(function(){ document.body.classList.add('loaded'); });
})();
</script>
