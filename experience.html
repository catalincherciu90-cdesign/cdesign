<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>C Design — Experiență 3D | Web Design 2025</title>
<link rel="icon" type="image/png" href="/logo-c-design.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e8112d; --red-lt:#ff2a44; --red-dk:#b80d23;
    --ink:#f3f4f6; --soft:#aeb4bd; --muted:#6c727c;
    --bg-0:#070809; --bg-1:#0c0e11; --bg-2:#14171b;
    --line:rgba(255,255,255,.07);
    --rx:0deg; --ry:0deg;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink); overflow:hidden;
    background:
      radial-gradient(120% 110% at 62% 36%, #1a1e24 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    background-attachment:fixed;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif}

  /* ---- Top bar ---- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;pointer-events:none}
  .topbar a,.topbar .brand{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:1.05rem;color:#fff;letter-spacing:.5px}
  .brand img{height:30px;width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
  .topbar .links{display:flex;gap:10px;align-items:center}
  .pill{font-size:.82rem;font-weight:600;text-decoration:none;padding:9px 16px;border-radius:40px;transition:.2s}
  .pill.ghost{color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
  .pill.ghost:hover{background:rgba(255,255,255,.13)}
  .pill.cta{color:#fff;background:linear-gradient(135deg,var(--red) 0%,var(--red-dk) 100%);border:1px solid rgba(255,255,255,.15);box-shadow:0 6px 22px rgba(232,17,45,.4)}
  .pill.cta:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(232,17,45,.55)}

  /* ---- Title block (top-left, 2D) ---- */
  .title-block{position:fixed;left:max(26px,4vw);top:14vh;z-index:40;max-width:min(420px,42vw);pointer-events:none}
  .title-block .eyebrow{font-family:'Space Grotesk';font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:.7rem;color:var(--red-lt);margin-bottom:12px}
  .title-block h1{font-size:clamp(2rem,4.4vw,3.4rem);font-weight:700;line-height:1.04;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .title-block h1 em{font-style:normal;color:var(--red-lt)}
  .title-block p{margin-top:14px;color:var(--soft);font-size:clamp(.92rem,1.5vw,1.05rem);line-height:1.55;max-width:360px}
  .title-block .hint{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);pointer-events:auto}
  .title-block .hint .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(232,17,45,.55);animation:pulse 2s infinite}

  /* ---- 3D Stage ---- */
  .stage{position:fixed;inset:0;perspective:1500px;perspective-origin:58% 46%;z-index:10}
  .scene{position:absolute;inset:0;transform-style:preserve-3d;
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .3s cubic-bezier(.22,.61,.36,1)}

  /* ground grid */
  .floor{position:absolute;left:54%;top:60%;width:1600px;height:1100px;
    transform:translate(-50%,-50%) rotateX(64deg) rotateZ(0deg);
    background:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 64px);
    -webkit-mask-image:radial-gradient(closest-side at 50% 45%, #000 38%, transparent 80%);
    mask-image:radial-gradient(closest-side at 50% 45%, #000 38%, transparent 80%);
    opacity:.9}
  .floor::after{content:'';position:absolute;inset:0;
    background:radial-gradient(closest-side at 50% 45%, rgba(232,17,45,.10), transparent 65%)}

  /* ---- CUBE BUTTON ---- */
  .cube-btn{position:absolute;transform-style:preserve-3d;cursor:pointer;width:0;height:0;
    animation:floaty 7s ease-in-out infinite alternate}
  .cube{position:absolute;left:0;top:0;transform-style:preserve-3d;
    width:var(--s);height:var(--s);
    transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-45deg) translateZ(0);
    transition:transform .3s cubic-bezier(.2,.7,.3,1)}
  .cube .f{position:absolute;width:var(--s);height:var(--s);border:1px solid rgba(255,255,255,.08);
    transition:border-color .25s, box-shadow .25s}
  .cube .top   {background:linear-gradient(135deg,#2b2f35 0%,#1a1d22 100%);transform:translateZ(calc(var(--s) / 2))}
  .cube .bottom{background:#070809;transform:rotateX(180deg) translateZ(calc(var(--s) / 2))}
  .cube .s1{background:linear-gradient(160deg,#191c20,#0e1013);transform:rotateY( 90deg) translateZ(calc(var(--s) / 2))}
  .cube .s2{background:linear-gradient(160deg,#101316,#0a0b0d);transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
  .cube .s3{background:linear-gradient(160deg,#15181c,#0c0e10);transform:rotateX( 90deg) translateZ(calc(var(--s) / 2))}
  .cube .s4{background:linear-gradient(160deg,#0d0f12,#080909);transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
  /* gloss + content on top face */
  .cube .top{display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .cube .top .glyph{font-size:calc(var(--s) * .34);filter:grayscale(.2) drop-shadow(0 2px 6px rgba(0,0,0,.5));opacity:.92;
    transform:rotate(45deg)} /* counter the rotateZ so glyph sits straight-ish on the rhombus */
  .cube .top .accent{position:absolute;right:8%;top:8%;width:22%;height:22%;background:var(--red);border-radius:3px;
    box-shadow:0 0 14px rgba(232,17,45,.6);transform:rotate(45deg)}
  .cube .s1::after,.cube .s3::after{content:'';position:absolute;left:14%;bottom:12%;width:30%;height:4px;background:var(--red);opacity:.85;box-shadow:0 0 10px rgba(232,17,45,.6)}

  /* shadow under cube */
  .cube-shadow{position:absolute;left:-50%;top:0;width:var(--s);height:calc(var(--s) * .6);
    transform:translate(-50%,0) rotateX(64deg);background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);
    filter:blur(6px);opacity:.6;pointer-events:none}

  /* hover/lift */
  .cube-btn:hover{z-index:50}
  .cube-btn:hover .cube{transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-45deg) translateZ(38px)}
  .cube-btn:hover .cube .f{border-color:rgba(232,17,45,.6);box-shadow:0 0 22px rgba(232,17,45,.25)}
  .cube-btn:focus-visible{outline:none}
  .cube-btn:focus-visible .cube .f{border-color:var(--red-lt)}

  /* upright label */
  .cube-label{position:absolute;left:0;top:0;transform:translate(-50%, calc(var(--s) * .62));
    display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;pointer-events:none}
  .cube-label .ct{font-family:'Space Grotesk';font-weight:700;font-size:.92rem;color:#fff;letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .cube-label .cs{font-size:.7rem;color:var(--soft)}
  .cube-btn:hover .cube-label .ct{color:var(--red-lt)}

  /* red accent props (decor) */
  .prop{position:absolute;transform-style:preserve-3d;pointer-events:none}
  .bar{width:18px;background:linear-gradient(180deg,var(--red-lt),var(--red-dk));border-radius:3px 3px 0 0;
    box-shadow:0 0 18px rgba(232,17,45,.45);transform-origin:bottom}
  .arrow{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:26px solid var(--red);
    filter:drop-shadow(0 0 10px rgba(232,17,45,.5))}

  /* ---- Overlay (dark) ---- */
  .overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.on{display:flex}
  .overlay .scrim{position:absolute;inset:0;background:rgba(4,5,6,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .3s}
  .overlay.on .scrim{opacity:1}
  .panel{position:relative;width:min(620px,94vw);max-height:86vh;overflow:auto;border-radius:22px;padding:34px 32px;
    background:linear-gradient(160deg,#15181d 0%,#0d0f12 100%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 40px 100px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(232,17,45,.12);
    transform:translateY(28px) scale(.95);opacity:0;transition:transform .4s cubic-bezier(.18,.78,.3,1), opacity .35s}
  .overlay.on .panel{transform:none;opacity:1}
  .panel .x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);cursor:pointer;font-size:1.2rem;color:var(--soft);display:grid;place-items:center;transition:.2s}
  .panel .x:hover{background:var(--red);color:#fff;border-color:var(--red);transform:rotate(90deg)}
  .panel .p-ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.8rem;margin-bottom:14px;
    background:linear-gradient(135deg,rgba(232,17,45,.22),rgba(232,17,45,.06));border:1px solid rgba(232,17,45,.3)}
  .panel h2{font-size:clamp(1.5rem,3.4vw,2.1rem);color:#fff;line-height:1.1;margin-bottom:6px}
  .panel .lead{color:var(--soft);font-size:1rem;margin-bottom:18px}
  .panel ul{list-style:none;display:grid;gap:10px;margin:0 0 22px}
  .panel ul li{display:flex;gap:11px;align-items:flex-start;font-size:.95rem;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
  .panel ul li b{color:#fff}
  .panel ul li .ck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#fff;
    background:linear-gradient(135deg,var(--red),var(--red-dk));margin-top:1px}
  .panel .actions{display:flex;flex-wrap:wrap;gap:12px}
  .panel .btn{flex:1 1 auto;text-align:center;text-decoration:none;font-family:'Space Grotesk';font-weight:600;font-size:.92rem;
    padding:14px 22px;border-radius:12px;transition:.2s}
  .panel .btn.primary{color:#fff;background:linear-gradient(135deg,var(--red),var(--red-dk));box-shadow:0 10px 26px rgba(232,17,45,.4)}
  .panel .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(232,17,45,.55)}
  .panel .btn.line{color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18)}
  .panel .btn.line:hover{background:rgba(255,255,255,.12)}

  /* ---- animations ---- */
  @keyframes floaty{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,17,45,.5)}70%{box-shadow:0 0 0 10px rgba(232,17,45,0)}100%{box-shadow:0 0 0 0 rgba(232,17,45,0)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .loaded .title-block{animation:rise .8s both}
  .loaded .cube-btn{animation:floaty 7s ease-in-out infinite alternate}

  /* ---- Mobile: flatten to dark cards ---- */
  @media(max-width:860px){
    body{overflow:auto}
    .stage{position:relative;height:auto;min-height:auto;perspective:none;padding:0}
    .scene{position:static;transform:none!important}
    .floor,.prop,.cube-shadow{display:none}
    .title-block{position:relative;left:auto;top:auto;max-width:none;width:100%;padding:96px 20px 8px}
    #cubes{display:flex;flex-direction:column;gap:14px;padding:8px 18px 60px;max-width:520px;margin:0 auto}
    .cube-btn{position:static!important;width:100%;height:auto;animation:none!important;transform:none!important;
      background:linear-gradient(160deg,#15181d,#0d0f12);border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--red);
      border-radius:14px;padding:16px 18px}
    .cube{display:none}
    .cube-label{position:static;transform:none;align-items:flex-start;white-space:normal}
    .cube-label .ct{font-size:1.05rem}
    .cube-btn::after{content:'›';position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--red-lt);font-size:1.6rem}
    .topbar{position:fixed;background:rgba(7,8,9,.82);backdrop-filter:blur(10px)}
    .topbar .links .pill.ghost{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    .cube-btn,.title-block,.hint .dot{animation:none!important}
    .scene,.cube{transition:none}
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/" aria-label="C Design — acasă">
      <img src="/logo-c-design.png" alt="C Design"><span>C&nbsp;Design</span>
    </a>
    <nav class="links">
      <a class="pill ghost" href="/">Site clasic</a>
      <a class="pill cta" href="/programare">Programează acum</a>
    </nav>
  </header>

  <div class="title-block">
    <div class="eyebrow">Web Design · 2025</div>
    <h1>Tot ce facem, <em>în cuburi</em></h1>
    <p>Fiecare cub e un buton. Apasă pe el și se deschide ce te interesează.</p>
    <span class="hint"><span class="dot"></span> Apasă pe un cub</span>
  </div>

  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="floor"></div>

      <!-- red accent props -->
      <div class="prop" style="left:64%;top:30%;transform:translateZ(40px)"><div class="bar" style="height:120px"></div></div>
      <div class="prop" style="left:68%;top:32%;transform:translateZ(40px)"><div class="bar" style="height:78px;opacity:.8"></div></div>
      <div class="prop" style="left:33%;top:74%;transform:rotate(-90deg)"><div class="arrow"></div></div>

      <!-- cubes injected here -->
      <div id="cubes"></div>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" aria-modal="true" role="dialog">
    <div class="scrim" id="scrim"></div>
    <div class="panel" id="panel"></div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- Content blocks ---------- */
  var BLOCKS = {
    servicii:{ icon:"🧩", title:"Servicii", sub:"Tot ce-ți trebuie online",
      lead:"De la idee la site live — construim prezența ta digitală cap-coadă.",
      items:[["Site de prezentare","profesional, livrat în maxim 14 zile"],["Redesign site","modernizăm site-ul existent + performanță"],["Design grafic & logo","identitate vizuală completă"],["Mentenanță","actualizări, securitate și suport tehnic"]],
      cta:{label:"Vezi serviciile",href:"/servicii"}, alt:{label:"Cere ofertă",href:"/programare"} },
    portofoliu:{ icon:"🖼️", title:"Portofoliu", sub:"Rezultate reale",
      lead:"Afaceri ca a ta, cu site-uri care chiar aduc clienți.",
      items:[["Proiecte locale","afaceri din Ilfov, București și toată România"],["Mobile-first","arată perfect pe orice ecran"],["Optimizate SEO","ca să te găsească clienții pe Google"]],
      cta:{label:"Vezi portofoliul",href:"/#portofoliu"}, alt:null },
    pachete:{ icon:"🚀", title:"Pachet Startup", sub:"De la 300€",
      lead:"Pachet complet pentru un start rapid și solid online.",
      items:[["Site de prezentare","domeniu .ro + găzduire incluse"],["Logo profesional","identitate vizuală de la zero"],["Prezență online","configurare și suport la pornire"]],
      cta:{label:"Vezi pachetul",href:"/pachet-startup"}, alt:{label:"Abonament lunar",href:"/abonament-lunar"} },
    despre:{ icon:"💬", title:"Despre noi", sub:"De ce C Design",
      lead:"Facem site-uri care aduc clienți, nu premii.",
      items:[["Din 2017","experiență cu zeci de afaceri mici"],["Preț fix","ofertă clară, fără costuri ascunse"],["Livrare rapidă","site complet în maxim 14 zile, garantat"]],
      cta:{label:"Despre noi",href:"/despre-noi"}, alt:null },
    blog:{ icon:"📰", title:"Blog", sub:"Idei & ghiduri",
      lead:"Sfaturi practice de web design, SEO și prezență online.",
      items:[["Ghiduri","cum să-ți crești afacerea online"],["Tendințe 2025","ce funcționează acum în web design"]],
      cta:{label:"Citește blogul",href:"/blog"}, alt:null },
    testimoniale:{ icon:"⭐", title:"Testimoniale", sub:"Ce spun clienții",
      lead:"Ei ne-au ales — și nu au regretat.",
      items:[["Comunicare","rapiditate și claritate"],["Rezultate","site-uri care generează cereri"]],
      cta:{label:"Vezi testimonialele",href:"/#testimoniale"}, alt:null },
    contact:{ icon:"📅", title:"Programare", sub:"Consultanță gratuită",
      lead:"Pregătit să discutăm despre site-ul tău? Te contactăm în maxim 2 ore.",
      items:[["Consultanță gratuită","alegi data și ora preferată"],["Telefon","0753 116 155 — luni–vineri 09:00–18:00"],["Email","office@c-design.ro"]],
      cta:{label:"Programează acum",href:"/programare"}, alt:{label:"Sună 0753 116 155",href:"tel:+40753116155"} }
  };

  /* cube layout: key, left%, top%, size px, float delay */
  var CUBES = [
    ["servicii",    40, 40, 150, 0.0],
    ["portofoliu",  56, 30, 120, 0.6],
    ["pachete",     30, 58, 130, 1.2],
    ["despre",      48, 62, 110, 0.3],
    ["blog",        62, 52, 100, 0.9],
    ["testimoniale",70, 40,  90, 1.5],
    ["contact",     46, 80, 140, 0.45]
  ];

  var cubesWrap = document.getElementById('cubes');
  CUBES.forEach(function(c){
    var key=c[0], b=BLOCKS[key];
    var el=document.createElement('div');
    el.className='cube-btn';
    el.style.left=c[1]+'%'; el.style.top=c[2]+'%';
    el.style.setProperty('--s', c[3]+'px');
    el.style.animationDelay=(-c[4])+'s';
    el.setAttribute('data-key',key);
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-label', b.title+' — '+b.sub);
    el.innerHTML=
      '<div class="cube-shadow"></div>'+
      '<div class="cube">'+
        '<div class="f top"><span class="accent"></span><span class="glyph">'+b.icon+'</span></div>'+
        '<div class="f bottom"></div>'+
        '<div class="f s1"></div><div class="f s2"></div>'+
        '<div class="f s3"></div><div class="f s4"></div>'+
      '</div>'+
      '<div class="cube-label"><span class="ct">'+b.title+'</span><span class="cs">'+b.sub+'</span></div>';
    cubesWrap.appendChild(el);
  });

  /* ---------- Overlay ---------- */
  var overlay=document.getElementById('overlay'), panel=document.getElementById('panel'), lastFocus=null;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function openBlock(key){
    var b=BLOCKS[key]; if(!b) return;
    lastFocus=document.activeElement;
    var li=b.items.map(function(it){return '<li><span class="ck">✓</span><span><b>'+esc(it[0])+'</b> — '+esc(it[1])+'</span></li>';}).join('');
    var actions='<a class="btn primary" href="'+b.cta.href+'">'+esc(b.cta.label)+'</a>';
    if(b.alt) actions+='<a class="btn line" href="'+b.alt.href+'">'+esc(b.alt.label)+'</a>';
    panel.innerHTML='<button class="x" id="closeX" aria-label="Închide">✕</button>'+
      '<div class="p-ic">'+b.icon+'</div><h2>'+esc(b.title)+'</h2><p class="lead">'+esc(b.lead)+'</p>'+
      '<ul>'+li+'</ul><div class="actions">'+actions+'</div>';
    overlay.classList.add('on');
    document.getElementById('closeX').addEventListener('click',closeBlock);
    var fb=panel.querySelector('.btn'); if(fb) fb.focus();
  }
  function closeBlock(){overlay.classList.remove('on'); if(lastFocus&&lastFocus.focus) lastFocus.focus();}

  cubesWrap.addEventListener('click',function(e){var n=e.target.closest('.cube-btn'); if(n) openBlock(n.getAttribute('data-key'));});
  cubesWrap.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var n=e.target.closest('.cube-btn'); if(n){e.preventDefault(); openBlock(n.getAttribute('data-key'));}}});
  document.getElementById('scrim').addEventListener('click',closeBlock);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('on')) closeBlock();});

  /* ---------- Parallax ---------- */
  var isTouch=window.matchMedia('(max-width:860px)').matches;
  if(!isTouch){
    var tx=0,ty=0,cx=0,cy=0,raf;
    window.addEventListener('mousemove',function(e){
      tx=(e.clientX/window.innerWidth-.5)*10;
      ty=-(e.clientY/window.innerHeight-.5)*7;
      if(!raf) raf=requestAnimationFrame(loop);
    });
    function loop(){
      cx+=(tx-cx)*0.08; cy+=(ty-cy)*0.08;
      document.documentElement.style.setProperty('--ry',cx.toFixed(2)+'deg');
      document.documentElement.style.setProperty('--rx',cy.toFixed(2)+'deg');
      if(Math.abs(tx-cx)>0.01||Math.abs(ty-cy)>0.01){raf=requestAnimationFrame(loop);}else{raf=null;}
    }
  }

  requestAnimationFrame(function(){document.body.classList.add('loaded');});
})();
</script>
</body>
</html>
