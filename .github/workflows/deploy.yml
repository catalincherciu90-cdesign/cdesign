name: Deploy la Cloudflare

# Rulează automat la fiecare push în main (inclusiv merge de PR)
# și poate fi pornit și manual din tab-ul Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy cu Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# deploy trigger: secrete Cloudflare configurate
